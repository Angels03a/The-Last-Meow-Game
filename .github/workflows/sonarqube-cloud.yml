
name: TLMG - SonarQube Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  analyze:
    name: Build, tests and SonarQube
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore legacy packages
        shell: pwsh
        run: |
          nuget install Server/TLMG.Services/packages.config -OutputDirectory Server/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

      
      - name: Restore project references
        shell: pwsh
        run: |
          $projects = @(
            "Server/TLMG.DataAccess/TLMG.DataAccess.csproj",
            "Server/TLMG.Server/TLMG.Server.csproj",
            "test/TLMG.Domain.Tests/TLMG.Domain.Tests.csproj",
            "test/TLMG.Services.Tests/TLMG.Services.Tests.csproj",
            "Client/TLMG.Client/TLMG.Client.csproj"
          )
          foreach ($project in $projects) {
            msbuild $project /t:Restore /p:Configuration=Debug /nr:false
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
          }

      - name: Install analysis tools
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) { throw "Scanner installation failed" }
          dotnet tool install --global dotnet-coverage
          if ($LASTEXITCODE -ne 0) { throw "Coverage installation failed" }

      - name: Authenticate to SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@v1
        id: sonar-auth
        with:
          project-key: Angels03a_The-Last-Meow-Game

      - name: Begin SonarQube analysis
        shell: pwsh
        run: |
          dotnet sonarscanner begin `
            /k:"${{ steps.sonar-auth.outputs.project-key }}" `
            /o:"${{ steps.sonar-auth.outputs.organization }}" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.scanner.scanAll=false `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/packages/**,**/*.Designer.cs,**/*.g.cs,**/Reference.cs"
          if ($LASTEXITCODE -ne 0) { throw "SonarQube begin failed" }

      - name: Build client and server
        shell: pwsh
        run: |
          msbuild Client/TLMG.Client.slnx /t:Rebuild /p:Configuration=Debug /m:1 /nr:false /p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "Client build failed" }

          msbuild Server/TLMG.Server.slnx /t:Rebuild /p:Configuration=Debug /m:1 /nr:false /p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "Server build failed" }


      - name: Execute xUnit tests with coverage
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (!$vs) { throw "Visual Studio not found" }

          $vstest = Join-Path $vs "Common7/IDE/CommonExtensions/Microsoft/TestWindow/vstest.console.exe"
          if (!(Test-Path $vstest)) { throw "VSTest not found" }

          # Allow launching VSTest without a path containing spaces.
          $env:PATH = "$(Split-Path $vstest -Parent);$env:PATH"

          $domain = (Resolve-Path "test/TLMG.Domain.Tests/bin/Debug/TLMG.Domain.Tests.dll").Path
          $services = (Resolve-Path "test/TLMG.Services.Tests/bin/Debug/TLMG.Services.Tests.dll").Path

          $command = "vstest.console.exe $domain $services /Logger:trx"
          dotnet-coverage collect $command -f xml -o coverage.xml

          if ($LASTEXITCODE -ne 0) { throw "Tests or coverage failed" }
          if (!(Test-Path coverage.xml)) { throw "Coverage report missing" }

          Write-Host "Coverage report generated successfully."


      - name: Finish SonarQube analysis
        shell: pwsh
        run: |
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw "SonarQube end failed" }

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlmg-coverage
          path: |
            coverage.xml
            **/*.trx
          if-no-files-found: warn
          retention-days: 7
